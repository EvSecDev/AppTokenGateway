<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy"
    content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=()">
  <link rel="icon" href="/atgui/favicon.ico">
  <title>API Token Management</title>
  <link rel="stylesheet" href="/atgui/style.css">
</head>

<body>
  <div class="container">
    <h2>API Token Management</h2>
    <div id="domain" class="subtitle"></div>

    <div class="section">
      <h3>Existing Tokens</h3>
      <ul id="tokenList" class="token-list"></ul>
      <div id="emptyState" class="empty-state">No tokens registered</div>
    </div>

    <hr class="divider">

    <div class="section">
      <h3>Create New Token</h3>

      <div class="form-group">
        <label class="label" for="name">Token Name</label>
        <input type="text" id="name" class="name-input" placeholder="e.g. ci-deploy, prod-api" maxlength="64">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label" for="len">Length</label>
          <div class="slider-row">
            <input type="number" id="lenNum" min="32" max="128" value="64" class="len-num">
            <input type="range" id="len" min="32" max="128" value="64">
          </div>
        </div>

        <div class="form-group">
          <label class="label" for="expSelect">Expires</label>
          <select id="expSelect" class="exp-select">
            <option value="">No expiration</option>
            <option value="10m">10 minutes</option>
            <option value="1h">1 hour</option>
            <option value="24h">24 hours</option>
            <option value="1w">1 week</option>
            <option value="custom">Custom...</option>
          </select>
        </div>
      </div>

      <div id="expOptions" class="exp-options">
        <div class="exp-mode">
          <label><input type="radio" name="expMode" value="relative" id="expModeRelative" checked> Relative</label>
          <label><input type="radio" name="expMode" value="absolute" id="expModeAbsolute"> Specific date/time</label>
        </div>

        <div id="expRelative" class="exp-relative">
          <input type="number" id="expAmount" min="1" value="10">
          <select id="expUnit">
            <option value="minutes">minutes</option>
            <option value="hours">hours</option>
            <option value="days">days</option>
            <option value="weeks">weeks</option>
          </select>
        </div>

        <div id="expAbsolute" class="exp-absolute">
          <input type="datetime-local" id="expDate">
        </div>

        <div id="expPreview" class="exp-preview"></div>
      </div>

      <button id="gen">Generate Token</button>

      <div class="token-box">
        <input id="token" class="token-input" readonly placeholder=" ">
        <div class="actions">
          <button id="copy" class="secondary">Copy</button>
          <button id="register">Register</button>
        </div>
      </div>

      <div id="msg" class="message"></div>
    </div>
  </div>

  <script src="/atgui/main.js"></script>
</body>

</html>
