<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Token Registration</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: #fff;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
    }

    input[type="range"] {
      width: 100%;
      margin: 10px 0;
    }

    .token-input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #444;
      border-radius: 4px;
      background: #333;
      color: #fff;
    }

    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 4px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #0056b3;
    }

    .message {
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Register API Token</h2>

    <input type="range" id="len" min="32" max="128" value="64">
    <div id="label">Token Length: 64</div>

    <button id="gen">Generate Token</button>

    <div id="box" style="display:none;">
      <input id="token" class="token-input" readonly>
      <button id="copy">Copy and Register</button>
    </div>

    <div id="msg" class="message"></div>
  </div>
  <script>
    const len = document.getElementById('len');
    const label = document.getElementById('label');
    const box = document.getElementById('box');
    const tokenEl = document.getElementById('token');
    const msg = document.getElementById('msg');

    len.oninput = () => {
      label.textContent = `Token Length: ${len.value}`;
    };

    document.getElementById('gen').onclick = () => {
      const n = +len.value;
      const bytes = crypto.getRandomValues(new Uint8Array(n));
      const chars = 'abcdef0123456789';

      let t = '';
      for (let i = 0; i < n; i++) {
        t += chars[bytes[i] % chars.length];
      }

      tokenEl.value = t;
      box.style.display = 'block';
    };

    document.getElementById('copy').onclick = async () => {
      const token = tokenEl.value;
      if (!token) {
        msg.textContent = 'No token';
        return;
      }

      await navigator.clipboard.writeText(token);

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        msg.textContent = res.ok
          ? 'Token registered successfully'
          : await res.text();
      } catch (e) {
        msg.textContent = e.message;
      }
    };
  </script>
</body>

</html>
